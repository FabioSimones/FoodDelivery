server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/totem_fastfood_db
    username: totem_user
    password: totem_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html